<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SerialBridge · 控制台</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><aside class="side"><div class="brand"><div class="brandmark logo-text">⇄</div><div><div class="brandtitle">SerialBridge</div><div class="brandsub">PEER CONTROL CONSOLE</div></div></div><div class="nav-label">工作空间</div><nav class="nav" aria-label="主导航"><button class="nav-btn active" data-page="overview"><span>▦</span>总览</button><button class="nav-btn" data-page="logs"><span>≡</span>实时日志</button><button class="nav-btn" data-page="transfers"><span>⇅</span>文件传输</button><button class="nav-btn" data-page="settings"><span>⚙</span>设置</button></nav><div class="side-gap"></div><div class="side-status"><div class="side-status-top"><span id="side-dot" class="dot bad"></span><span id="side-name">尚未连接</span></div><div id="side-detail" class="side-status-sub">正在检查本机服务</div></div><div class="side-foot"><span>0.1.0 · Alpha</span><span id="run-mode">LIVE</span></div></aside>
<div class="main-shell"><header class="topbar"><div class="crumb"><b id="page-title">总览</b><span class="top-sub">/ SerialBridge</span></div><div class="top-actions"><span class="pill neutral" id="connection-pill">未连接</span><button class="btn" id="refresh">↻ 刷新</button><button class="btn primary" id="ping">测试对端</button></div></header><main class="content"><div id="demo-banner" class="status-banner hidden">演示模式：所有连接、日志和传输都是模拟数据，不连接真实硬件。</div><div id="error-banner" class="state-message hidden" role="alert"></div><div id="page-content"></div></main></div></div>
<dialog class="modal-live" id="dialog"><h2 id="dialog-title"></h2><div id="dialog-content"></div><div class="modal-footer"><button class="btn" id="close-dialog">关闭</button></div></dialog>
<dialog class="modal-live" id="connect-dialog"><h2>连接本机 SerialBridge</h2><form id="connect-form"><label class="form-label">本地 HTTP 端口<input id="api-port" type="number" value="9527" min="1" max="65535" required></label><label class="form-label">本地 API Token<input id="api-token" type="password" autocomplete="off" required placeholder="通过 serialbridge token 查看"></label><p class="form-hint">只连接 127.0.0.1。凭据仅保存在当前浏览器会话。Tauri 桌面端无需手工输入。</p><div class="modal-footer"><button class="btn" id="close-connect" type="button">暂不连接</button><button class="btn primary" type="submit">连接</button></div></form></dialog>
<input type="file" id="push-picker" class="hidden"><div class="toast-live hidden" id="toast" role="status"></div><script type="module" src="assets/main.js"></script></body></html>
