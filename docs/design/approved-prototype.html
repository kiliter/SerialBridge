function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function statCard({name,icon,value,sub,online=true,color='blue',status}){return `<div class="card stat"><div class="stat-head"><span class="stat-label">${name}</span><span class="icon-box ${color}">${ic(icon,18)}</span></div><div class="stat-mini ${online?'':'bad'}"><span class="dot ${online?'':'bad'}"></span>${status||(online?'正常':'离线')}</div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div>`}

function overviewHTML(){return commonHeading('节点监控','连接状态，一目了然。','同时查看本机服务、USB 串口、两端扩展与最近的请求事件。',`<button class="btn" data-action="toggle-peer">${ic('repeat')} ${state.peer?'模拟断开对端':'模拟恢复对端'}</button><button class="btn primary" data-action="ping">${ic('heartbeat')} 测试 Ping</button>`)+`<section class="stats">${statCard({name:'本机 HTTP 服务',icon:'terminal',value:'127.0.0.1:'+state.port,sub:'统一 RPC API · Axum',status:'监听中'})}${statCard({name:'USB 串口链路',icon:'cable',value:state.peer?'FT232R / COM':'已断开',sub:state.baud+' baud · 双向通信',online:state.peer,color:'violet',status:state.peer?'稳定':'断开'})}${statCard({name:'本地浏览器扩展',icon:'browser',value:state.localExtension?'Chrome MV3':'未连接',sub:'WebSocket · localhost',online:state.localExtension,color:'green'})}${statCard({name:'对端浏览器扩展',icon:'browser',value:state.peer&&state.remoteExtension?'Chrome MV3':'不可用',sub:'通过串口同步远端状态',online:state.peer&&state.remoteExtension,color:'violet'})}</section><section class="card topology"><div class="section-head"><div><h2>双端通信拓扑</h2><div class="section-desc">每台电脑都是独立节点，扩展挂载在各自本地，无 Host / Client 区分</div></div><button class="ghost-link" data-page="settings">节点配置 ${ic('chevron',13)}</button></div><div class="topology-body">${nodeBlock(true)}<div class="wire-area"><div class="wire"><div class="wire-dot">${ic('double',19)}</div></div><div class="wire-caption"><b>${state.peer?'USB 双向链路':'链路已断开'}</b><span>FT232RL · ${state.baud} baud</span></div></div>${nodeBlock(false)}</div><div class="topology-foot"><div class="footmetric">${ic('clock')} 往返延迟 <b>${state.peer?'12 ms':'—'}</b></div><div class="footmetric">${ic('heartbeat')} 链路状态 <b>${state.peer?'健康':'离线'}</b></div><div class="footmetric">${ic('shield')} HTTP 监听 <b>仅 127.0.0.1</b></div><div class="footmetric">${ic('plug')} 扩展通道 <b>${(state.localExtension?1:0)+(state.peer&&state.remoteExtension?1:0)} / 2</b></div></div></section><div class="two-col"><section class="card"><div class="section-head"><div><h2>最近活动</h2><div class="section-desc">RPC / Browser function filesHTML(){const finished=transfers.filter(t=>t.status==='completed').length;const ongoing=transfers.filter(t=>t.status==='active').length;return commonHeading('二进制传输','文件传输','浏览器下载、跨端文件拉取和推送，统一监控传输进度。',`<button class="btn primary" data-action="new-transfer">${ic('download')} 模拟新下载</button>`)+`<section class="file-grid"><div class="card file-stat"><span class="muted">总传输任务</span><div><strong>${transfers.length}</strong></div><p>已创建的文件任务</p></div><div class="card file-stat"><span class="muted">成功完成</span><div><strong>${finished}</strong></div><p>完整性校验通过</p></div><div class="card file-stat"><span class="muted">正在传输</span><div><strong>${ongoing}</strong></div><p>通过 USB 数据流传输</p></div></section><section class="card"><div class="section-head"><div><h2>传输任务</h2><div class="section-desc">所有传输由本机任务管理器统一维护</div></div><span class="desc-tag">SHA-256 校验 · 分块传输</span></div><div class="file-list">${transfers.map(t=>`<div class="file-row"><div class="file-icon">${ic('files',19)}</div><div class="file-main"><b>${escapeHTML(t.name)}</b><small>${t.kind} · ${t.route}</small></div><div class="file-meta">${t.size}<small>记录于 ${t.time}</small></div><div><span class="file-status ${t.status==='completed'?'done':t.status==='active'?'ongoing':'paused'}">${t.status==='completed'?'✓ 已完成':t.status==='active'?'↗ 传输中':'Ⅱ 已暂停'}</span><div class="file-progress"><span style="width:${t.done}%"></span></div></div><div class="file-controls">${t.status==='completed'?`<button class="btn small" data-action="transfer-detail" data-id="${t.id}">详情</button>`:`<button class="btn small" data-action="toggle-transfer" data-id="${t.id}">${t.status==='active'?'暂停':'继续'}</button>`}</div></div>`).join('')}</div></section><div class="notice">${ic('info',14)} 传输列表使用模拟任务。实际版本采用临时文件、背压、进度查询和 SHA-256 校验；串口速率不会因使用界面而提升。</div>`}
function settingsHTML(){return commonHeading('节点配置','简洁设置','两台电脑的设置完全一样，仅串口设备名和系统运行环境不同。',`<button class="btn primary" data-action="save-settings">${ic('save')} 保存设置</button>`)+`<div class="settings-layout"><section class="card settings-card"><h2>本地 HTTP 服务</h2><p>所有 CLI / Agent / 脚本只调用这一地址</p><div class="setting-line"><label class="field-label">HTTP 监听地址</label><div class="setting-row"><div class="input-shell" style="flex:1"><input value="127.0.0.1" readonly /><span class="suffix">仅回环</span></div><div class="input-shell" style="width:112px"><input id="port-input" inputmode="numeric" value="${state.port}" /></div></div><div class="hint">出于安全考虑，初版仅允许监听 127.0.0.1</div></div><div class="toggle-row"><div class="toggle-copy"><b>开机自动启动</b><small>登录系统后自动运行 SerialBridge</small></div><input class="toggle" type="checkbox" data-setting="autostart" ${state.autostart?'checked':''} aria-label="开机自动启动" /></div><div class="toggle-row"><div class="toggle-copy"><b>关闭窗口后保留托盘</b><small>HTTP 和串口继续在后台运行</small></div><input class="toggle" type="checkbox" data-setting="tray" ${state.tray?'checked':''} aria-label="关闭窗口后保留托盘" /></div></section><section class="card settings-card"><h2>串口连接</h2><p>独立于 FT232RL 芯片，只依赖系统串口接口</p><div class="setting-line"><label class="field-label">串口设备</label><div class="setting-row"><select class="field" id="serial-port" style="flex:1;min-width:0"><option value="/dev/cu.usbserial-FT232R" ${state.serialPort==='/dev/cu.usbserial-FT232R'?'selected':''}>/dev/cu.usbserial-FT232R</option><option value="COM5" ${state.serialPort==='COM5'?'selected':''}>COM5 · USB Serial Port</option></select><button class="btn" data-action="scan-ports">${ic('repeat')} 扫描</button></div></div><div class="setting-line"><label class="field-label">波特率</label><select class="field" id="baud-rate" style="width:100%">${['115200','460800','921600','3000000'].map(s=>`<option value="${s}" ${s===state.baud?'selected':''}>${s}${s==='921600'?' · 推荐实测后使用':''}</option>`).join('')}</select><div class="hint">更改需要两端配置一致，不支持单边实时切换</div></div><div class="toggle-row"><div class="toggle-copy"><b>自动重连</b><small>USB 拔插后自动扫描并重新握手</small></div><input class="toggle" type="checkbox" checked disabled aria-label="自动重连（不可关闭）" /></div></section><section class="card settings-card"><h2>浏览器扩展</h2><p>扩展通过本机 WebSocket 主动连接 SerialBridge</p><div class="setting-line"><label class="field-label">扩展通信地址</label><div class="setting-row"><div class="input-shell" style="flex:1;min-width:0"><input id="ws-address" value="ws://127.0.0.1:${state.port}/v1/extension/ws" readonly /></div><button class="btn" data-action="copy-websocket">${ic('copy')}</button></div></div><div class="setting-line"><label class="field-label">本地扩展状态</label><div class="status-row"><span class="pill ${state.localExtension?'':'off'}"><span class="dot ${state.localExtension?'':'bad'}"></span>${state.localExtension?'Chrome MV3 已连接':'扩展未连接'}</span><span class="desc-tag">WebSocket · 已配对（模拟）</span></div></div><div class="setting-line"><label class="field-label">首次配对</label><div class="setting-row"><div class="input-shell" style="width:143px"><input id="pair-code" style="letter-spacing:2px;font-weight:780" readonly value="${state.pairCode||'••••••'}" /></div><button class="btn" data-action="generate-pair">${ic('shield')} 生成配对码</button><button class="btn" data-action="copy-pair">${ic('copy')}</button></div><div class="hint">演示配对码不具备真实认证能力</div></div></section><section class="card settings-card"><h2>日志与隐私</h2><p>日志方便排障，但不应保存 Cookie、Token 等敏感内容</p><div class="setting-line"><label class="field-label">日志级别</label><select class="field" id="setting-log-level" style="width:100%"><option>INFO（推荐）</option><option>DEBUG</option><option>WARN</option><option>ERROR</option></select></div><div class="setting-line"><label class="field-label">内存日志上限</label><select class="field" style="width:100%"><option>最近 2,000 条</option><option>最近 5,000 条</option><option>最近 10,000 条</option></select></div><div class="toggle-row"><div class="toggle-copy"><b>敏感内容自动脱敏</b><small>Authorization / Cookie / Set-Cookie</small></div><input class="toggle" type="checkbox" checked disabled aria-label="敏感内容自动脱敏" /></div><div class="toggle-row"><div class="toggle-copy"><b>限制执行目标域名</b><small>必须由节点明确授权请求域名</small></div><input class="toggle" type="checkbox" checked disabled aria-label="限制执行目标域名" /></div></section></div><div class="setting-bottom"><span class="muted" style="margin-right:auto;font-size:11px;align-self:center">演示状态不会保存到本地配置文件</span><button class="btn" data-action="restore-settings">恢复演示默认值</button><button class="btn primary" data-action="save-settings">${ic('save')} 保存设置</button></div>`}
function render(){document.getElementById('app').innerHTML=`<div class="app"><div id="side-container">${sidebar()}</div><main class="main-shell"><div id="top-container">${toolbar()}</div><div class="content" id="page-content">${({overview:overviewHTML,logs:logsHTML,files:filesHTML,settings:settingsHTML}[state.page])()}</div></main></div>`;if(state.page==='logs'){document.getElementById('filter-level').value=state.logLevel;document.getElementById('filter-module').value=state.logModule;renderLogRows();}document.title=`SerialBridge · ${{overview:'总览',logs:'实时日志',files:'文件传输',settings:'设置'}[state.page]}（原型）`}
function showDetail(id){let l=logs.find(x=>x.id===Number(id));if(!l)return;const content=`<div class="drawer-backdrop" data-action="close-drawer"><aside class="drawer" onclick="event.stopPropagation()"><div class="drawer-head"><div><div class="eyebrow">EVENT DETAIL</div><div class="drawer-title">日志事件详情</div></div><button class="btn small" data-action="close-drawer">${ic('x',15)}</button></div><div class="detail-head"><span class="level ${l.level}">${l.level.toUpperCase()}</span><span class="micro-badge">${escapeHTML(l.module)}</span><span class="muted tiny">${escapeHTML(l.time)}</span></div><h3 style="font-size:15px;font-weight:740;line-height:1.6">${escapeHTML(l.msg)}</h3><div class="detail-kv"><span>消息编号</span><span>#${l.id}</span></div><div class="detail-kv"><span>通信方向</span><span>${escapeHTML(l.dir)}</span></div><div class="detail-kv"><span>耗时</span><span>${escapeHTML(l.latency)}</span></div><div class="detail-kv"><span>模块</span><span>${escapeHTML(l.module)}</span></div><div style="font-size:12px;font-weight:740;margin-top:24px">结构化元数据</div><pre class="codebox">${escapeHTML(JSON.stringify(l.details,null,2))}</pre><div class="notice">${ic('shield',14)} 真实日志需要对 Token、Cookie 和响应正文脱敏。</div></aside></div>`;document.getElementById('drawer-root').innerHTML=content}
function simulatePing(){if(state.peer){appendLog('success','RPC','A → B','system.ping 收到 PONG · 节点 B 响应', '12 ms',{method:'system.ping',target:'peer',result:'pong',roundTripMs:12});showToast('Ping 成功','模拟对端往返延迟 12 ms')}else{appendLog('error','RPC','A → B','PING 失败 · SERIAL_PEER_DISCONNECTED','—',{code:'SERIAL_PEER_DISCONNECTED'});showToast('Ping 失败','模拟对端未连接')}}
function simulateFetch(){if(state.peer&&state.remoteExtension){appendLog('success','Browser','A → B','browser.fetch GET /api/status · HTTP 200','172 ms',{executor:'browser.fetch',target:'peer',status:200,method:'GET',url:'https://example.com/api/status',body:'[响应正文已隐藏]'});showToast('浏览器请求成功','模拟对端 Chrome Extension 返回 HTTP 200')}else{appendLog('error','Browser','A → B','browser.fetch 失败 · 对端扩展不可用','—',{code:'BROWSER_DISCONNECTED'});showToast('模拟请求失败','对端扩展不可用')}}
function togglePeer(){state.peer=!state.peer;appendLog(state.peer?'success':'error','Serial','A ↔ B',state.peer?'FT232R 重新握手完成 · 对端恢复连接':'检测到 USB 串口断开 · 对端不可用','—',{peerState:state.peer?'connected':'disconnected'});render();showToast(state.peer?'已模拟恢复连接':'已模拟断开连接','点击按钮可以反复切换状态')}
function newTransfer(){const item={id:Math.max(0,...transfers.map(x=>x.id))+1,name:'remote-download-'+String(Math.floor(Math.random()*900+100))+'.zip',route:'B → A',kind:'浏览器下载',size:'8.0 MiB',done:0,status:'active',time:time().slice(0,5)};transfers.unshift(item);appendLog('info','Transfer','B → A',`文件下载任务已创建 · ${item.name}`,'—',{file:item.name,status:'queued'});render();if(!state.transferTimer){state.transferTimer=setInterval(()=>{let active=transfers.filter(t=>t.status==='active'&&t.done<100);active.forEach(t=>{t.done=Math.min(100,t.done+Math.floor(Math.random()*6+4));if(t.done===100){t.status='completed';appendLog('success','Transfer',t.route,`传输完成 · ${t.name} · 校验通过`,'—',{filename:t.name,status:'completed',checksum:'verified'})}});if(state.page==='files')document.getElementById('page-content').innerHTML=filesHTML();if(active.length===0){clearInterval(state.transferTimer);state.transferTimer=null}},1200)}}
function exportLogs(){const blob=new Blob([JSON.stringify(filterLogs(true),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='serialbridge-demo-logs.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('已导出演示日志','只包含本页面生成的模拟数据')}
function handleAction(action,el){switch(action){case 'copy-endpoint':copyValue('http://127.0.0.1:'+state.port);break;case 'copy-websocket':copyValue('ws://127.0.0.1:'+state.port+'/v1/extension/ws');break;case 'ping':simulatePing();break;case 'simulate-fetch':simulateFetch();break;case 'toggle-peer':togglePeer();break;case 'pause-logs':state.pauseLogs=!state.pauseLogs;render();showToast(state.pauseLogs?'已暂停更新':'已恢复更新','演示日志查看行为');break;case 'add-error':appendLog('error','Browser','B → A','模拟错误 · EXTENSION_CHANNEL_TIMEOUT','15000 ms',{code:'EXTENSION_CHANNEL_TIMEOUT',message:'浏览器扩展处理超时'});showToast('已添加模拟错误日志');break;case 'export-logs':exportLogs();break;case 'new-transfer':newTransfer();break;case 'toggle-transfer':{const t=transfers.find(x=>x.id===Number(el.dataset.id));if(t){t.status=t.status==='active'?'paused':'active';render();showToast(t.status==='active'?'模拟任务已继续':'模拟任务已暂停',t.name)}break;}case 'transfer-detail':{const t=transfers.find(x=>x.id===Number(el.dataset.id));if(t)showToast(t.name,'模拟 SHA-256 校验通过 · '+t.route);break;}case 'scan-ports':showToast('模拟发现 2 个串口','/dev/cu.usbserial-FT232R · COM5');break;case 'generate-pair':state.pairCode=String(Math.floor(100000+Math.random()*900000));render();showToast('已生成模拟配对码','这不是真实的安全凭据');break;case 'copy-pair':if(state.pairCode)copyValue(state.pairCode);else showToast('请先生成配对码');break;case 'save-settings':{const port=document.getElementById('port-input')?.value||state.port;if(!/^\d+$/.test(port)||Number(port)<1024||Number(port)>65535){showToast('请输入有效的端口号','允许范围 1024–65535');return;}state.port=port;state.serialPort=document.getElementById('serial-port')?.value||state.serialPort;state.baud=document.getElementById('baud-rate')?.value||state.baud;render();showToast('设置已模拟保存','演示原型不会修改本机实际配置');break;}case 'restore-settings':state.port='9527';state.serialPort='/dev/cu.usbserial-FT232R';state.baud='921600';state.autostart=true;state.tray=true;render();showToast('已恢复演示默认设置');break;case 'close-drawer':document.getElementById('drawer-root').innerHTML='';break;}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;render();return}let log=e.target.closest('[data-log]');if(log){showDetail(log.dataset.log);return}let action=e.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action)}});
document.addEventListener('input',e=>{if(e.target.id==='log-search'){state.logQuery=e.target.value;renderLogRows()}});
document.addEventListener('change',e=>{if(e.target.id==='filter-level'){state.logLevel=e.target.value;renderLogRows()}else if(e.target.id==='filter-module'){state.logModule=e.target.value;renderLogRows()}else if(e.target.dataset.setting){state[e.target.dataset.setting]=e.target.checked}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('drawer-root').innerHTML=''}});
render();
</script>
</body>
</html>
