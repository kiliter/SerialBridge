name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm test
      - run: cargo test -p serialbridge-core
      - run: cargo check -p serialbridge-desktop
      - run: cargo build -p serialbridge-core --release
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}
          path: |
            target/release/serialbridge
            target/release/serialbridge.exe
          if-no-files-found: error
