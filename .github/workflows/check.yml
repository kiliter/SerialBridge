name: Test, build and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serialbridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }} tests and installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: SerialBridge-Windows
            files: target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            bundles: dmg
            artifact: SerialBridge-macOS
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: SerialBridge-Linux
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}
          cache-on-failure: true
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p serialbridge-core --all-targets --locked -- -D warnings
      - run: cargo test -p serialbridge-core --locked
      - run: cargo build -p serialbridge-core --locked
      - name: Real headless process integration
        run: python tests/e2e.py --output artifacts/headless-results.json
      - name: Live UI and real Chromium extension integration
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          python tests/e2e.py --extension --output artifacts/browser-results.json
          python tests/test_packaging.py
      - run: cargo check -p serialbridge-desktop --locked
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build desktop installer
        shell: bash
        env:
          NO_STRIP: 'true'
          CI: 'true'
        run: |
          args=(--bundles "${{ matrix.bundles }}" -- --locked)
          if [ "$RUNNER_OS" = macOS ]; then
            args=(--target universal-apple-darwin "${args[@]}")
          fi
          npm run desktop:build -- "${args[@]}"
      - name: Native desktop startup smoke
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            NO_AT_BRIDGE=1 GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a python tests/desktop_smoke.py target/release/serialbridge-desktop
          elif [ "$RUNNER_OS" = macOS ]; then
            python tests/desktop_smoke.py target/universal-apple-darwin/release/serialbridge-desktop
          else
            python tests/desktop_smoke.py target/release/serialbridge-desktop.exe
          fi
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
      - name: Build Chrome extension ZIP
        if: runner.os == 'Linux'
        run: python scripts/package-extension.py
      - name: Upload Chrome extension
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SerialBridge-Chrome
          path: artifacts/SerialBridge-Chrome-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish verified Alpha prerelease
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SerialBridge-*
          merge-multiple: true
          path: artifacts
      - name: Verify groups and publish installers and extension
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find artifacts -name '*.exe' | wc -l)" -ge 1
          test "$(find artifacts -name '*.dmg' | wc -l)" -ge 1
          test "$(find artifacts -name '*.deb' | wc -l)" -ge 1
          test "$(find artifacts -name '*.AppImage' | wc -l)" -ge 1
          test "$(find artifacts -name 'SerialBridge-Chrome-*.zip' | wc -l)" -eq 1
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          tag="v${version}-${GITHUB_SHA:0:7}"
          # The Linux artifact preserves deb/ and appimage/ subdirectories.
          mapfile -d '' packages < <(find artifacts -type f -print0 | sort -z)
          for package in "${packages[@]}"; do
            digest=$(sha256sum "$package" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$digest" "$(basename "$package")"
          done > SHA256SUMS
          gh release create "$tag" "${packages[@]}" SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "SerialBridge ${version} (${GITHUB_SHA:0:7})" --notes-file docs/RELEASE.md
